services:
  app:
    image: kryptikker/queuedos:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:28080:8080"
    environment:
      PORT: "8080"
      QUEUEDOS_DATABASE_URL: jdbc:postgresql://db:5432/queuedos
      QUEUEDOS_DATABASE_USER: queuedos
      QUEUEDOS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      QUEUEDOS_SESSION_SECRET: ${QUEUEDOS_SESSION_SECRET}
      QUEUEDOS_PUBLIC_BASE_URL: https://queue.kryptikk.de
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: queuedos
      POSTGRES_USER: queuedos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - queuedos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U queuedos -d queuedos" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  queuedos-postgres:
